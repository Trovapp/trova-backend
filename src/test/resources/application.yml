server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: http://localhost:3000
  pipeline:
    script-path: pipeline-test/run_pipeline.py
    itinerary-script-path: pipeline-test/generate_itinerary.py
    verify-script-path: pipeline-test/verify_places.py
    work-dir: build/tmp/pipeline-test-work
    gemini-api-key: test-key
  kakao:
    rest-api-key: test-kakao-rest-api-key
