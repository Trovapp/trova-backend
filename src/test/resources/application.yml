server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    # 컨텍스트마다 다른 메모리 DB를 쓴다(#482). 이름이 같으면 컨텍스트 캐시(32개)에서 밀려 닫히는 컨텍스트의
    # create-drop이 아직 살아 있는 다른 컨텍스트의 표까지 지워, 실행 순서에 따라 "Table USERS not found"로 깨졌다.
    # random.uuid는 읽을 때마다 새 값이지만, 이 URL은 컨텍스트가 DataSource를 만들 때 한 번만 읽힌다.
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  # 시작 예열(#356)은 테스트에서 끈다 — RANDOM_PORT 테스트에 요청이 섞이지 않게. StartupWarmupTest가 직접 부른다.
  warmup:
    enabled: false
  # 멈춘 작업 다시 보내기(ADR 0043)는 테스트에서 끈다 — 다른 테스트가 남긴 PENDING 행을 실제 처리로 보내지 않게.
  # StuckJobRequeueServiceIntegrationTest가 켜서 직접 부른다.
  queue:
    requeue:
      enabled: false
  frontend-url: http://localhost:3000
  pipeline:
    script-path: pipeline-test/run_pipeline.py
    itinerary-script-path: pipeline-test/generate_itinerary.py
    verify-script-path: pipeline-test/verify_places.py
    select-script-path: pipeline-test/select_place_match.py
    tag-places-script-path: pipeline-test/tag_places.py
    summarize-reviews-script-path: pipeline-test/summarize_reviews.py
    work-dir: build/tmp/pipeline-test-work
    gemini-api-key: test-key
  kakao:
    rest-api-key: test-kakao-rest-api-key
  google:
    places-api-key: test-google-places-api-key
  weather:
    openweather-api-key: test-openweather-api-key
  congestion:
    seoul-opendata-api-key: test-seoul-opendata-api-key
  jwt-secret: test-jwt-secret-please-do-not-use-in-production-environment
  mobile-redirect-scheme: trova

# 메인 application.yml과 같은 기본값(#149) — 이 파일이 메인 설정을 덮어쓰므로 여기에도 둔다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
