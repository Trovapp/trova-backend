server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    hikari:
      data-source-properties:
        # Supabase의 커넥션 풀러(PgBouncer, transaction 모드)는 server-side prepared
        # statement를 지원하지 않는다. 풀에서 커넥션을 재사용할 때마다 실제 서버 세션이
        # 바뀔 수 있어, JDBC 드라이버가 캐싱한 prepared statement 이름(S_1, S_2...)이
        # 다른 세션에 이미 존재하는 것과 충돌해 "prepared statement already exists"
        # 에러로 요청이 간헐적으로 실패한다. prepareThreshold=0으로 server-side prepare
        # 자체를 끈다.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid를 절대 추가하지 말 것: OIDC 경로(OidcUserService)로 로그인이 처리되면서
            # CustomOAuth2UserService가 통째로 건너뛰어져 사용자 upsert가 조용히 동작하지 않게 된다.
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

management:
  endpoints:
    web:
      exposure:
        # 기본은 health만 공개한다 — 예전엔 prometheus까지 기본 노출돼 배포 서버에서 서버 지표가
        # 로그인 없이 공개됐다(#27). 로컬 모니터링 스택(docker-compose.monitoring.yml)으로 스크랩할 때만
        # ACTUATOR_EXPOSE=health,prometheus 로 켠다.
        include: ${ACTUATOR_EXPOSE:health}
  metrics:
    tags:
      application: trova-backend

app:
  # 사용자별 하루 호출 한도(#33, 한국 시간 자정 기준) — 넘으면 429.
  # Gemini 무료 한도는 전체 사용자 공유, Google Places는 무료 크레딧 초과 시 과금이라 한 사용자가 소진하지 못하게 막는다.
  quota:
    shares-per-day: ${QUOTA_SHARES_PER_DAY:20}
    place-calls-per-day: ${QUOTA_PLACE_CALLS_PER_DAY:100}
  # 관리자 API(/api/admin/*)를 쓸 수 있는 사용자 — "로그인제공자:제공자사용자ID"를 쉼표로 구분(예: google:1234).
  # 비워두면 아무도 쓸 수 없다.
  admin:
    users: ${ADMIN_USERS:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  pipeline:
    script-path: ${PIPELINE_SCRIPT_PATH:pipeline-test/run_pipeline.py}
    itinerary-script-path: ${ITINERARY_SCRIPT_PATH:pipeline-test/generate_itinerary.py}
    verify-script-path: ${VERIFY_SCRIPT_PATH:pipeline-test/verify_places.py}
    select-script-path: ${SELECT_SCRIPT_PATH:pipeline-test/select_place_match.py}
    tag-places-script-path: ${TAG_PLACES_SCRIPT_PATH:pipeline-test/tag_places.py}
    summarize-reviews-script-path: ${SUMMARIZE_REVIEWS_SCRIPT_PATH:pipeline-test/summarize_reviews.py}
    work-dir: ${PIPELINE_WORK_DIR:pipeline-test/work}
    gemini-api-key: ${GEMINI_API_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
  weather:
    openweather-api-key: ${OPENWEATHER_API_KEY:}
  congestion:
    seoul-opendata-api-key: ${SEOUL_OPENDATA_API_KEY:}
  jwt-secret: ${JWT_SECRET}
  mobile-redirect-scheme: ${MOBILE_REDIRECT_SCHEME:trova}
