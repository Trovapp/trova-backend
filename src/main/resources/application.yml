server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    hikari:
      data-source-properties:
        # Supabase의 커넥션 풀러(PgBouncer, transaction 모드)는 server-side prepared
        # statement를 지원하지 않는다. 풀에서 커넥션을 재사용할 때마다 실제 서버 세션이
        # 바뀔 수 있어, JDBC 드라이버가 캐싱한 prepared statement 이름(S_1, S_2...)이
        # 다른 세션에 이미 존재하는 것과 충돌해 "prepared statement already exists"
        # 에러로 요청이 간헐적으로 실패한다. prepareThreshold=0으로 server-side prepare
        # 자체를 끈다.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid를 절대 추가하지 말 것: OIDC 경로(OidcUserService)로 로그인이 처리되면서
            # CustomOAuth2UserService가 통째로 건너뛰어져 사용자 upsert가 조용히 동작하지 않게 된다.
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  pipeline:
    script-path: ${PIPELINE_SCRIPT_PATH:pipeline-test/run_pipeline.py}
    itinerary-script-path: ${ITINERARY_SCRIPT_PATH:pipeline-test/generate_itinerary.py}
    verify-script-path: ${VERIFY_SCRIPT_PATH:pipeline-test/verify_places.py}
    work-dir: ${PIPELINE_WORK_DIR:pipeline-test/work}
    gemini-api-key: ${GEMINI_API_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
