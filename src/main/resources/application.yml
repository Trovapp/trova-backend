server:
  port: 8080
  # 재시작·배포 때 처리 중인 요청을 끝내고 내려간다(#43). 비동기 작업 대기 시간은 AsyncConfig 참고.
  shutdown: graceful
  # 운영 서버는 Caddy가 https를 받아 http로 넘긴다. X-Forwarded-Proto를 읽어야 OAuth 돌아올 주소가 https로 만들어진다(#67).
  # 앱은 127.0.0.1에서만 받으므로 Tomcat 기본 신뢰 범위(내부 주소)로 충분하다.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  lifecycle:
    # 비동기 실행기가 진행 중인 영상 처리·재구성을 마칠 때까지 기다리는 상한(AsyncConfig와 같은 값).
    timeout-per-shutdown-phase: 60s
  datasource:
    hikari:
      data-source-properties:
        # Supabase의 커넥션 풀러(PgBouncer, transaction 모드)는 server-side prepared
        # statement를 지원하지 않는다. 풀에서 커넥션을 재사용할 때마다 실제 서버 세션이
        # 바뀔 수 있어, JDBC 드라이버가 캐싱한 prepared statement 이름(S_1, S_2...)이
        # 다른 세션에 이미 존재하는 것과 충돌해 "prepared statement already exists"
        # 에러로 요청이 간헐적으로 실패한다. prepareThreshold=0으로 server-side prepare
        # 자체를 끈다.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # app.queue.type=kafka일 때만 쓴다(#244, ADR 0021). 기본(async)에서는 Kafka 빈이 만들어져도 연결하지 않는다.
  # Aiven 같은 원격 브로커는 SSL·SASL 설정을 SPRING_KAFKA_SECURITY_PROTOCOL 등 환경 변수로 더한다.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # 리스너가 처음 붙기 전에 쌓인 작업도 처리한다.
      auto-offset-reset: earliest
      # 한 번에 하나씩 — 분석 한 건이 수십 초라 여러 건을 가져오면 뒤의 작업이 앞 작업이 끝날 때까지 묶인다.
      max-poll-records: 1
    producer:
      properties:
        # 브로커가 꺼져 있으면 send()가 브로커 정보를 기본 60초까지 기다려 공유 요청이 61초 걸렸다(로컬 실측) — 5초에 503으로.
        max.block.ms: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid를 절대 추가하지 말 것: OIDC 경로(OidcUserService)로 로그인이 처리되면서
            # CustomOAuth2UserService가 통째로 건너뛰어져 사용자 upsert가 조용히 동작하지 않게 된다.
            # email은 요청하지 않는다(#121) — 쓰는 값은 sub·name·picture뿐이고 셋 다 profile 범위로 온다(최소 수집).
            scope: profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  # API 문서(#149). 운영 서버에서 API 구조가 로그인 없이 공개되지 않게 기본은 끈다(#27 actuator와 같은 방식).
  # 로컬에서 API_DOCS_ENABLED=true로 켜면 /swagger-ui.html, /v3/api-docs가 열린다.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  # 문서에는 앱·웹이 부르는 /api/**만 담는다(로그인·actuator 경로 제외).
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        # 기본은 health만 공개한다 — 예전엔 prometheus까지 기본 노출돼 배포 서버에서 서버 지표가
        # 로그인 없이 공개됐다(#27). 로컬 모니터링 스택(docker-compose.monitoring.yml)으로 스크랩할 때만
        # ACTUATOR_EXPOSE=health,prometheus 로 켠다.
        include: ${ACTUATOR_EXPOSE:health}
  metrics:
    tags:
      application: trova-backend
    distribution:
      # HTTP 응답 시간 분포를 내보내 Prometheus에서 API별 p95를 계산한다.
      percentiles-histogram:
        http.server.requests: true

app:
  # 영상 분석 작업 대기열(#244, ADR 0021). async(기본) = 서버 안 @Async, kafka = Kafka 토픽 trova.share-jobs.
  queue:
    type: ${APP_QUEUE_TYPE:async}
    kafka:
      concurrency: 2
      # 로컬 Docker 브로커 1대는 1. 브로커가 여러 대인 곳(Aiven 등)은 그곳 최소값에 맞춘다.
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
  # 영상 분석이 끝나면 일정 초안을 자동으로 만들지(#136). 문제가 생기면 끌 수 있게 설정으로 둔다.
  auto-draft:
    enabled: ${AUTO_DRAFT_ENABLED:true}
  # 사용자별 하루 호출 한도(#33, 한국 시간 자정 기준) — 넘으면 429.
  # Gemini 무료 한도는 전체 사용자 공유, Google Places는 무료 크레딧 초과 시 과금이라 한 사용자가 소진하지 못하게 막는다.
  quota:
    shares-per-day: ${QUOTA_SHARES_PER_DAY:20}
    place-calls-per-day: ${QUOTA_PLACE_CALLS_PER_DAY:100}
  # IP별 분당 요청 수 제한(#239) — 넘으면 429. 앱 폴링(5초)보다 넉넉하게 감으로 정함(실측 아님), 0이면 끈다. 서버 안(127.0.0.1) 요청은 세지 않는다.
  rate-limit:
    ip-per-minute: ${IP_RATE_LIMIT_PER_MINUTE:300}
  # 관리자 API(/api/admin/*)를 쓸 수 있는 사용자 — "로그인제공자:제공자사용자ID"를 쉼표로 구분(예: google:1234).
  # 비워두면 아무도 쓸 수 없다.
  admin:
    users: ${ADMIN_USERS:}
    # 요청 횟수 제한(#163) — 감으로 정함, 실측 아님. 교환은 IP당, 관리자 API는 관리자당 분당.
    rate-limit:
      exchange-per-minute: ${ADMIN_EXCHANGE_PER_MINUTE:10}
      admin-api-per-minute: ${ADMIN_API_PER_MINUTE:120}
  # 관리자 웹 주소(Cloudflare Pages, 예: https://trova-admin.pages.dev) — 로그인 뒤 돌아갈 주소·CORS에 이 하나만 허용(#163).
  # 비워두면 관리자 웹 로그인은 꺼진다.
  admin-web-url: ${APP_ADMIN_WEB_URL:}
  # PWA 웹앱 주소(Cloudflare Pages) — 로그인 뒤 돌아갈 주소·CORS(쿠키 없이 /api 전체)(#165, ADR 0013). 비워두면 웹앱 로그인은 꺼진다.
  web-app-url: ${APP_WEB_APP_URL:}
  # iOS 단축어 공유 전용 키의 키당 분당 요청 수(#165) — 감으로 정함, 실측 아님.
  share-key:
    per-minute: ${SHARE_KEY_PER_MINUTE:10}
  # PWA 웹 푸시(ADR 0016). 공개·비공개 키가 비면 알림만 꺼진다(로컬·테스트 기본).
  # 공개 키: 비압축 EC 공개 키 base64url, 비공개 키: PKCS8 DER base64 한 줄. 만드는 법은 docs/superpowers/plans/2026-10-14-web-push.md Task D1.
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:trovapp26@gmail.com}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # 서버 이름 — 서버 상태 스냅샷(server_metric_snapshots)을 서버별로 나눈다(#161). 운영은 APP_INSTANCE_NAME=prod.
  # 운영·로컬이 같은 DB를 쓸 때 이 값이 같으면 대시보드 서버 탭에 두 서버 값이 섞인다.
  instance-name: ${APP_INSTANCE_NAME:local}
  pipeline:
    script-path: ${PIPELINE_SCRIPT_PATH:pipeline-test/run_pipeline.py}
    itinerary-script-path: ${ITINERARY_SCRIPT_PATH:pipeline-test/generate_itinerary.py}
    verify-script-path: ${VERIFY_SCRIPT_PATH:pipeline-test/verify_places.py}
    select-script-path: ${SELECT_SCRIPT_PATH:pipeline-test/select_place_match.py}
    tag-places-script-path: ${TAG_PLACES_SCRIPT_PATH:pipeline-test/tag_places.py}
    summarize-reviews-script-path: ${SUMMARIZE_REVIEWS_SCRIPT_PATH:pipeline-test/summarize_reviews.py}
    work-dir: ${PIPELINE_WORK_DIR:pipeline-test/work}
    gemini-api-key: ${GEMINI_API_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
  weather:
    openweather-api-key: ${OPENWEATHER_API_KEY:}
  congestion:
    seoul-opendata-api-key: ${SEOUL_OPENDATA_API_KEY:}
  jwt-secret: ${JWT_SECRET}
  mobile-redirect-scheme: ${MOBILE_REDIRECT_SCHEME:trova}
