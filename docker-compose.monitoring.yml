# 로컬 개발용 관측성 스택. Spring Boot(8080)는 도커 밖(호스트)에서 직접 돌리고,
# 이 스택은 그걸 스크랩만 한다 — 앱 자체는 컨테이너화하지 않음(아직 k3s 단계 아님).
#
# 실행: docker compose -f docker-compose.monitoring.yml up -d
#   앱은 지표 엔드포인트를 켜서 실행해야 스크랩된다(기본은 health만 노출, #27):
#   ACTUATOR_EXPOSE=health,prometheus ./gradlew bootRun
# 접속: Prometheus http://localhost:9090, Grafana http://localhost:3300
#
# 운영 서버 지표(ADR 0015): Mac에서 SSH 터널을 열어 두면 job=trova-prod로 수집된다.
#   ssh -N -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes -i <키> -L 127.0.0.1:18080:127.0.0.1:8080 ubuntu@<서버>
#   운영 지표가 이 Mac에 쌓이므로 포트는 127.0.0.1에만 연다(같은 와이파이의 다른 기기에서 못 보게).
#
# Grafana 기본 포트(3000)는 이 머신에서 Plan B용 Grafana(Homebrew, PID로 실행 중)와
# Next.js 프론트가 이미 쓰고 있어서 3300으로 옮김 — 서로 다른 프로젝트 인스턴스라 하나로
# 합치지 않고 각자 띄운다.

name: trova-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: trova-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: trova-grafana
    environment:
      # 로컬 전용 편의 설정 — 실배포 시 반드시 인증 켜야 함
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

# 이름을 고정해 워크트리/Compose 프로젝트가 바뀌어도 같은 데이터를 사용한다.
# 기존 실행 환경 전환 시 monitoring/README.md의 백업·이관 절차를 먼저 따른다.
volumes:
  prometheus-data:
    name: trova-prometheus-data
  grafana-data:
    name: trova-grafana-data
