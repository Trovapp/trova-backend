rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="trova-prod",instance="test:8080"}'
        values: '1 0 0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: TrovaProductionScrapeUnavailable
        exp_alerts: []
      - eval_time: 1m15s
        alertname: TrovaProductionScrapeUnavailable
        exp_alerts:
          - exp_labels:
              job: trova-prod
              instance: test:8080
              severity: warning
            exp_annotations:
              summary: 운영 서버 지표 수집 중단
              description: SSH 터널, Docker, 대상 설정, 운영 서버 순서로 확인한다. 수집 실패만으로 서비스 장애라고 단정하지 않는다.
      - eval_time: 1m30s
        alertname: TrovaProductionScrapeUnavailable
        exp_alerts: []
  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: TrovaProductionScrapeUnavailable
        exp_alerts:
          - exp_labels:
              job: trova-prod
              severity: warning
            exp_annotations:
              summary: 운영 서버 지표 수집 중단
              description: SSH 터널, Docker, 대상 설정, 운영 서버 순서로 확인한다. 수집 실패만으로 서비스 장애라고 단정하지 않는다.
