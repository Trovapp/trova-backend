plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trova'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		// Gemini 호출을 Spring AI로(#243, ADR 0020). 2.0은 Spring Boot 4 기준.
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 영상 분석 시작 대기열을 Kafka로 바꿀 수 있게(#244, ADR 0021) — 기본은 꺼져 있고 app.queue.type=kafka일 때만 연결한다.
	implementation('org.springframework.boot:spring-boot-starter-kafka') {
		// 메시지가 작업 id 하나라 압축을 켜지 않는다 — 압축 코덱 네이티브 라이브러리(zstd 7MB·snappy 2.2MB)는 그때만 필요해 JAR에서 뺀다.
		exclude group: 'com.github.luben', module: 'zstd-jni'
		exclude group: 'org.xerial.snappy', module: 'snappy-java'
	}
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.bsc.langgraph4j:langgraph4j-core:1.8.13'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	// API 문서 자동 생성(#149) — 기본은 꺼져 있고 API_DOCS_ENABLED=true일 때만 열린다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// PWA 웹 푸시(ADR 0016) — 의존성 없는 VAPID·암호화 라이브러리, HTTP는 Java 기본 HttpClient.
	implementation 'com.zerodeplibs:zerodep-web-push-java:2.1.5'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
