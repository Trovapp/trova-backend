# 영상 장소 추출 정확도(evalflow) — 정답 대비 재현율·정밀도. 실행: evalflow eval 스킬(`eval.sh run place-extract --label before|after`).
# 정답(expected)은 사람이 확인한 것만 믿는다. "초안"으로 표시된 정답은 파이프라인 출력에서 옮긴 것이라 사용자 확인 전까지는
# "같은 입력에서 결과가 바뀌었는가(회귀)"만 잰다. 이름은 공백을 뺀 뒤 비교한다.
description: 유튜브 쇼츠 10개에서 장소 이름 추출(Gemini 무료 티어, 영상당 Gemini 2회)
prompts: ["URL:{{url}}"]
providers: ["exec: python3 provider.py"]
defaultTest:
  assert:
    - type: javascript
      metric: recall
      value: |
        const norm = s => String(s).replace(/\s+/g, "");
        const got = JSON.parse(output).map(norm); const exp = JSON.parse(context.vars.expected).map(norm);
        const hit = exp.filter(x => got.includes(x)).length;
        return { pass: hit === exp.length, score: exp.length ? hit / exp.length : 1, reason: `맞힘 ${hit}/${exp.length}, 빠짐 ${exp.filter(x => !got.includes(x)).join(",") || "없음"}` };
    - type: javascript
      metric: precision
      value: |
        const norm = s => String(s).replace(/\s+/g, "");
        const got = JSON.parse(output).map(norm); const exp = JSON.parse(context.vars.expected).map(norm);
        const ok = got.filter(x => exp.includes(x)).length;
        return { pass: ok === got.length, score: got.length ? ok / got.length : 1, reason: `오탐 ${got.length - ok}개: ${got.filter(x => !exp.includes(x)).join(",") || "없음"}` };
tests:
