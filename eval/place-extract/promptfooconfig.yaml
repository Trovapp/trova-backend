# 영상 장소 추출 정확도(evalflow) — 정답 대비 재현율·정밀도. 실행: evalflow eval 스킬(`eval.sh run place-extract --label before|after`).
# 정답(expected)은 eval/extraction/answers.csv(사람이 영상을 보고 적은 것)에서 build_config.py가 만든다 — 여기서 손으로 고치지 않는다(ADR 0022).
# 이름은 공백을 뺀 뒤 한쪽이 다른 쪽을 포함하면 같은 곳으로 본다("테라로사 커피공장 본점" ≈ "테라로사 본점"). 정밀한 좌표 채점은 Part A(score.py).
# 정답이 비어 있으면(목적지 없음 영상) 결과가 비어야 맞다.
description: 장소 추출 회귀 — eval/extraction 정답 영상에서 장소 이름(Gemini 무료 티어, 영상당 Gemini 2회)
prompts: ["URL:{{url}}"]
providers: ["exec: python3 provider.py"]
defaultTest:
  assert:
    - type: javascript
      metric: recall
      value: |
        const norm = s => String(s).replace(/\s+/g, "");
        const same = (a, b) => a === b || a.includes(b) || b.includes(a);
        const got = JSON.parse(output).map(norm); const exp = JSON.parse(context.vars.expected).map(norm);
        if (exp.length === 0) return { pass: got.length === 0, score: got.length === 0 ? 1 : 0, reason: `목적지 없음 영상 — 출력 ${got.length}곳` };
        const hit = exp.filter(x => got.some(g => same(g, x))).length;
        return { pass: hit === exp.length, score: hit / exp.length, reason: `맞힘 ${hit}/${exp.length}, 빠짐 ${exp.filter(x => !got.some(g => same(g, x))).join(",") || "없음"}` };
    - type: javascript
      metric: precision
      value: |
        const norm = s => String(s).replace(/\s+/g, "");
        const same = (a, b) => a === b || a.includes(b) || b.includes(a);
        const got = JSON.parse(output).map(norm); const exp = JSON.parse(context.vars.expected).map(norm);
        const ok = got.filter(g => exp.some(x => same(g, x))).length;
        return { pass: ok === got.length, score: got.length ? ok / got.length : 1, reason: `오탐 ${got.length - ok}개: ${got.filter(g => !exp.some(x => same(g, x))).join(",") || "없음"}` };
    - type: javascript
      metric: strict_recall
      value: file://scoring.cjs:recall
    - type: javascript
      metric: strict_precision
      value: file://scoring.cjs:precision
tests:  # 아래는 build_config.py가 만든다 — 손으로 고치지 말 것
  - description: "1-youtube_shorts-김해 당일치기"
    vars: {url: "https://www.youtube.com/shorts/8vmpPuFwQ94", expected: "[\"가야랜드\", \"밀양돼지국밥\", \"수로왕릉\", \"명월카페\", \"만리향\", \"연지공원\"]"}
  - description: "2-youtube_shorts-묵호 노는법"
    vars: {url: "https://www.youtube.com/shorts/ppCfDrwbHMk", expected: "[\"하평해변\", \"파닭김밥\", \"어달삼거리\", \"어달항\", \"카페어달\", \"논골담길\", \"등대쉼터\", \"등대그집\", \"비비소\", \"해랑전망대\"]"}
  - description: "3-youtube_shorts-사당에서 노는법"
